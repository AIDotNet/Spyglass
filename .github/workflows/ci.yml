# NOTE: written alongside the code but not yet run on GitHub: first run may need small adjustments.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Tests use Microsoft.Testing.Platform (see global.json) and run Avalonia headless.
      - run: dotnet build Spyglass.slnx -c Debug
      - run: dotnet test --project tests/Spyglass.Protocol.Tests
      - run: dotnet test --project tests/Spyglass.IntegrationTests

  vs-extension:
    uses: ./.github/workflows/vs-extension.yml

  # Windows is where a running previewer locks bin/; the tests include a real build while it runs.
  vscode-windows:
    runs-on: windows-2022
    env:
      MSBUILDDISABLENODEREUSE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ide/vscode/package-lock.json
      - name: Build the hub
        run: dotnet build src/Spyglass.App -c Debug
      - name: Build the sample app
        run: dotnet build samples/Spyglass.Sample -c Debug
      - run: npm ci
        working-directory: ide/vscode
      - run: npm test
        working-directory: ide/vscode
      # The preview panel in a real VS Code, downloaded by the test.
      - run: npm run test:e2e
        working-directory: ide/vscode

  rider-windows:
    runs-on: windows-2022
    env:
      MSBUILDDISABLENODEREUSE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the sample app
        run: dotnet build samples/Spyglass.Sample -c Debug
      # Downloads the Rider SDK (~3.5 GB) to compile against.
      - run: ./gradlew.bat test
        working-directory: ide/rider

  pack:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet pack Spyglass.slnx -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: artifacts/*.nupkg
