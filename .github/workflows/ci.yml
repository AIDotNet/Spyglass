# NOTE: written alongside the code but not yet run on GitHub: first run may need small adjustments.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Tests use Microsoft.Testing.Platform (see global.json) and run Avalonia headless.
      - run: dotnet build Spyglass.slnx -c Debug
      - run: dotnet test --project tests/Spyglass.Protocol.Tests
      - run: dotnet test --project tests/Spyglass.IntegrationTests

  vs-extension:
    uses: ./.github/workflows/vs-extension.yml

  pack:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet pack Spyglass.slnx -c Release -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: artifacts/*.nupkg
