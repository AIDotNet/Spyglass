# Publishes every package to nuget.org when a version tag is pushed (git tag v0.1.0 && git push --tags).
# Uses NuGet Trusted Publishing (GitHub OIDC): no long-lived API key is stored. One-time setup on nuget.org:
#   Account > Trusted Publishing > add a policy (owner, this repository, workflow file `release.yml`),
#   then set the repository secret NUGET_USER to the nuget.org *username* (not the email).
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # lets NuGet/login exchange the GitHub OIDC token for a short-lived API key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Pack
        run: >
          dotnet pack Spyglass.slnx -c Release -o artifacts
          -p:Version=$VERSION
          -p:RepositoryUrl=${{ github.server_url }}/${{ github.repository }}
          -p:PackageProjectUrl=${{ github.server_url }}/${{ github.repository }}
      - uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: artifacts/*.nupkg
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
